<!doctype html>

<meta name="description" content="ASSH1 Contemporary Literature 1: accessible lessons and practice on figures of speech, schemes, diction, and imagery.">
<title>ASSH1 Contemporary Literature 1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Nunito:wght@300;400;700;800&display=swap">
<style>
:root{--bg:#232a1e;--ink:#fff;--muted:#d5ddca;--yellow:#ffc20e;--green:#a4e21f;--card:#2d3527;--focus:#fff;--danger:#ff8c98;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}html{scroll-behavior:smooth;scroll-padding-top:1rem}body{margin:0;background:var(--bg);background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:400 18px/1.55 Nunito,system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:28px 18px 60px}.skip{position:absolute;left:-9999px;top:8px;background:var(--yellow);color:#172014;padding:10px 14px;font-weight:800;z-index:10}.skip:focus{left:8px}h1,h2,h3{font-family:"Rubik Dirt",Impact,sans-serif;font-weight:400;color:var(--yellow);margin:0;letter-spacing:.5px}header{text-align:center;padding:10px 0 6px}.tiles{display:flex;justify-content:center;gap:8px;margin-bottom:14px}.tiles b{font:400 40px/1 "Rubik Dirt",Impact,sans-serif;width:58px;height:66px;display:grid;place-items:center;box-shadow:2px 3px 0 #0008}.tiles b:nth-child(1){background:#1fa64a;color:#fff8a8;transform:rotate(-4deg)}.tiles b:nth-child(2),.tiles b:nth-child(3){background:#f1d31c;color:#4239b0;transform:rotate(3deg)}.tiles b:nth-child(3){transform:rotate(-2deg)}.tiles b:nth-child(4){background:var(--green);color:#f0606e;transform:rotate(2deg)}.tiles b:nth-child(5){background:#f6c3bd;color:#7b9be6;transform:rotate(-3deg)}header h1{font-size:clamp(22px,4.5vw,34px)}header p{margin:4px 0;color:var(--muted)}nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:24px 0 8px}nav button,.next{font:800 16px Nunito,sans-serif;border:0;padding:10px 18px;background:var(--card);color:var(--ink);cursor:pointer;border-radius:2px;box-shadow:2px 3px 0 #0008}nav button[aria-selected=true]{background:var(--yellow);color:#232a1e;transform:rotate(-1.5deg)}button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.wk h2{font-size:clamp(28px,6vw,46px);margin:26px 0 4px}.sub{color:var(--muted);margin:0 0 18px;max-width:64ch}.intro{background:var(--card);border-left:6px solid var(--yellow);padding:14px 18px;margin-bottom:20px;max-width:70ch}.intro p{margin:0 0 8px}.intro p:last-child{margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.term{padding:16px 16px 18px;color:#1b2016;box-shadow:3px 4px 0 #0008}.term:nth-child(5n+1){background:#f1d31c;transform:rotate(-.6deg)}.term:nth-child(5n+2){background:var(--green);transform:rotate(.5deg)}.term:nth-child(5n+3){background:#f6c3bd;transform:rotate(-.4deg)}.term:nth-child(5n+4){background:#a9bdf2;transform:rotate(.6deg)}.term:nth-child(5n){background:#7fd39a;transform:rotate(-.5deg)}.term h3{color:#1b2016;font-size:24px}.term p{margin:6px 0 0;font-weight:700}.term em{display:block;margin-top:8px;font-size:15.5px;border-top:1px dashed #0008;padding-top:6px}.prac{margin-top:44px}.prac h2{font-size:clamp(26px,5vw,38px)}.qcard{background:var(--card);padding:22px;margin-top:14px;max-width:760px;box-shadow:3px 4px 0 #0008}.qmeta{color:var(--muted);font-size:15px;margin:0 0 10px}.quote{font:italic 400 22px/1.4 Georgia,serif;margin:0 0 4px}.src{color:var(--yellow);font-size:15px;margin:0 0 16px}.opts{display:grid;gap:10px}.opts button{font:700 17px Nunito,sans-serif;text-align:left;padding:12px 14px;background:#1b2016;color:var(--ink);border:2px solid #64725b;cursor:pointer;border-radius:2px}.opts button:hover:not(:disabled),.opts button:focus-visible{border-color:var(--yellow)}.opts button.ok{background:#1e5c33;border-color:var(--green)}.opts button.no{background:#6a2530;border-color:var(--danger)}.fb{margin:16px 0 0;padding:12px 14px;background:#1b2016;border-left:5px solid var(--yellow)}.fb strong{color:var(--yellow)}.next{margin-top:14px;background:var(--yellow);color:#232a1e}.score{font:400 56px/1 "Rubik Dirt",Impact,sans-serif;color:var(--yellow);margin:6px 0 10px}.bar{height:10px;background:#1b2016;margin:0 0 16px}.bar i{display:block;height:100%;background:var(--green);transition:width .3s}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}footer{margin-top:50px;color:var(--muted);font-size:14px;text-align:center}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}@media(max-width:500px){.tiles b{width:46px;height:56px;font-size:31px}.wrap{padding-inline:14px}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to lesson content</a>
<div class="wrap">
<header>
<div class="tiles" aria-hidden="true"><b>A</b><b>S</b><b>S</b><b>H</b><b>I</b></div>
<h1>Contemporary Literature 1</h1><p>Quarter 2 lessons and practice from real literary works</p>
</header>
<nav id="tabs" role="tablist" aria-label="Choose a lesson week"></nav>
<main id="main" tabindex="-1"></main>
<footer>Practice passages come from public-domain works and proverbs. Rizal’s poem is quoted from the 1911 Derbyshire English translation. Lessons follow your ASSH1 slides.</footer>
</div>
<script>
'use strict';
const weeks=[
{id:'w3',tab:'Week 3',title:'Figures of Speech',sub:'Words or phrases used in a non-literal way to emphasize, clarify, or embellish language.',intro:['Figurative language goes beyond a strictly literal meaning to communicate an idea, feeling, image, or relationship more effectively.','Figures of speech are specific techniques that produce a rhetorical or literary effect.'],lessons:[['A. Simile','Compares two things using “like” or “as”.'],['B. Metaphor','Compares two things directly.'],['C. Personification','Gives non-human ideas or concepts human-like attributes.'],['D. Hyperbole','A boldly overstated or exaggerated claim.'],['E. Oxymoron','Pairs opposing words to create a new meaning.'],['F. Onomatopoeia','Words that sound like what they describe.'],['G. Irony','A contrast between expectation and reality or meaning.'],['H. Paradox','Appears impossible but contains a meaningful truth.'],['I. Euphemism','A softer way to say something uncomfortable.'],['J. Synecdoche','Uses a part to represent the whole, or vice versa.'],['K. Metonymy','Uses a related word or idea instead of naming something directly.']],qs:[['“O my Luve’s like a red, red rose”','Robert Burns, “A Red, Red Rose”','Simile',['Metaphor','Personification','Hyperbole'],'The comparison uses “like”.'],['“All the world’s a stage, and all the men and women merely players.”','Shakespeare, As You Like It','Metaphor',['Simile','Irony','Euphemism'],'The world is directly called a stage.'],['“Because I could not stop for Death – He kindly stopped for me”','Emily Dickinson','Personification',['Oxymoron','Onomatopoeia','Synecdoche'],'Death is given a human trait: kindness.'],['“Parting is such sweet sorrow”','Shakespeare, Romeo and Juliet','Oxymoron',['Paradox','Simile','Hyperbole'],'“Sweet” and “sorrow” are opposing words paired together.'],['“The pen is mightier than the sword.”','Edward Bulwer-Lytton, Richelieu','Metonymy',['Simile','Oxymoron','Euphemism'],'“Pen” stands for writing and “sword” for military force.']]},
{id:'w4',tab:'Week 4',title:'Schemes',sub:'An artistic or purposeful departure from the ordinary arrangement of words, sounds, or grammatical structures.',intro:['A scheme changes or emphasizes the normal arrangement, pattern, repetition, omission, or balance of words.','Try it: “Peter Piper picked a peck of pickled peppers.” Which sound keeps coming back?'],lessons:[['1. Alliteration','Repetition of initial consonant sounds in nearby words.'],['2. Consonance','Repetition of a consonant sound within or at the end of words.'],['3. Assonance','Repetition of a vowel sound within nearby words.'],['4. Anaphora','Repetition at the beginning of successive clauses or lines.'],['5. Epistrophe','Repetition at the end of successive clauses or lines.'],['6. Parallelism','Similar grammatical structures in two or more phrases or clauses.'],['7. Anastrophe','Deliberately changing the normal order of words.'],['8. Climax','Arranging ideas in increasing order of importance or intensity.']],qs:[['“The fair breeze blew, the white foam flew, the furrow followed free”','Coleridge, “The Rime of the Ancient Mariner”','Alliteration',['Assonance','Epistrophe','Climax'],'The initial sounds repeat in nearby words.'],['“It was the best of times, it was the worst of times, it was the age of wisdom…”','Charles Dickens, A Tale of Two Cities','Anaphora',['Epistrophe','Anastrophe','Consonance'],'“It was” opens each successive clause.'],['“…of the people, by the people, for the people…”','Abraham Lincoln, Gettysburg Address','Epistrophe',['Anaphora','Alliteration','Anastrophe'],'The same phrase repeats at the end of successive phrases.'],['“Deep into that darkness peering, long I stood there wondering, fearing”','Edgar Allan Poe, “The Raven”','Anastrophe',['Climax','Parallelism','Epistrophe'],'“Long I stood there” reverses normal word order.'],['“…dedicate—we can not consecrate—we can not hallow—this ground.”','Abraham Lincoln, Gettysburg Address','Climax',['Alliteration','Consonance','Epistrophe'],'The verbs increase in force.']]},
{id:'w5',tab:'Week 5',title:'Diction and Imagery',sub:'Diction is an author’s linguistic choice. Imagery uses language to create a sensory picture.',intro:['Diction refers to vocabulary and word choice that fits a text’s style. Imagery evokes sensory experience, conveys abstract ideas, and sets tone and atmosphere.'],lessons:[['Denotation','The literal, dictionary meaning.','“Sick”: physically or mentally ill.'],['Connotation','Meaning created from feelings attached to a word.','“Sick”: extremely cool or impressive.'],['Formal diction','Formal, scientific, or professional language.','commence, perspiration'],['Informal diction','Casual, conversational language.','’kay, ASAP'],['Colloquial','Words specific to a geographic region.','gigil, diba?'],['Slang','Very informal words developed by communities.','lodi, slay'],['Visual','Appeals to sight.'],['Auditory','Appeals to sound or hearing.'],['Gustatory','Appeals to taste.'],['Tactile','Appeals to touch.'],['Olfactory','Appeals to smell.'],['Kinesthetic','Appeals to motion.'],['Organic','Appeals to internal sensations.']],qs:[['“Continuous as the stars that shine and twinkle on the milky way”','Wordsworth, “I Wandered Lonely as a Cloud”','Visual',['Auditory','Olfactory','Gustatory'],'Stars that shine appeal to sight.'],['“fluttering and dancing in the breeze”','William Wordsworth','Kinesthetic',['Tactile','Gustatory','Organic'],'Fluttering and dancing describe movement.'],['“the tintinnabulation that so musically wells from the bells”','Edgar Allan Poe, “The Bells”','Auditory',['Visual','Tactile','Olfactory'],'Bells appeal to hearing.'],['“candied apple, quince, and plum”','John Keats, “The Eve of St. Agnes”','Gustatory',['Olfactory','Visual','Kinesthetic'],'Candied fruits appeal to taste.'],['A character says she will “commence” her task after wiping away her “perspiration.”','Diction practice','Formal diction',['Slang','Colloquial','Informal diction'],'These are formal versions of start and sweat.']]},
{id:'ph',tab:'Filipino Lit',title:'Practice',sub:'Passages from Rizal, Balagtas, and Filipino proverbs, all in English.',intro:['Use the lessons from Weeks 3 to 5 to name the figure of speech, scheme, or imagery in each passage.'],lessons:[],qs:[['“Farewell, dear Fatherland, clime of the sun caressed, Pearl of the Orient seas, our Eden lost!”','José Rizal, “Mi Último Adiós”','Metaphor',['Simile','Onomatopoeia','Euphemism'],'The Philippines is directly called a pearl and an Eden.'],['“A quiet person is boiling inside.”','Filipino proverb','Metaphor',['Simile','Hyperbole','Onomatopoeia'],'Hidden anger is described as something boiling.'],['“Our grandmother has passed away,” in place of “Our grandmother died.”','Everyday Filipino usage','Euphemism',['Hyperbole','Paradox','Metonymy'],'It is a softer way to say something painful.'],['“More brilliant, more fresh, more flowering.”','José Rizal, “Mi Último Adiós”','Parallelism',['Epistrophe','Anastrophe','Consonance'],'The phrases use the same grammatical structure.'],['“In a dark, desolate forest”','Francisco Balagtas, Florante at Laura','Visual',['Gustatory','Olfactory','Auditory'],'Darkness and a forest appeal to sight.']]}
];
const $=s=>document.querySelector(s),shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);let current=0,index=0,score=0,questions=[];
function renderTabs(){const tabs=$('#tabs');tabs.innerHTML=weeks.map((w,i)=>`<button role="tab" id="tab-${w.id}" aria-controls="panel" aria-selected="${i===current}" tabindex="${i===current?0:-1}">${w.tab}: ${w.title}</button>`).join('');tabs.querySelectorAll('button').forEach((b,i)=>{b.onclick=()=>{current=i;renderTabs();renderPage()};b.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();current=(i+1)%weeks.length;renderTabs();renderPage();$('#tab-'+weeks[current].id).focus()}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();current=(i+weeks.length-1)%weeks.length;renderTabs();renderPage();$('#tab-'+weeks[current].id).focus()}}})}
function renderPage(){const w=weeks[current];index=0;score=0;questions=shuffle(w.qs).slice(0,Math.min(6,w.qs.length));$('#main').innerHTML=`<section id="panel" role="tabpanel" aria-labelledby="tab-${w.id}" class="wk"><h2>${w.title}</h2><p class="sub">${w.sub}</p><div class="intro">${w.intro.map(x=>`<p>${x}</p>`).join('')}</div>${w.lessons.length?`<div class="grid">${w.lessons.map(x=>`<article class="term"><h3>${x[0]}</h3><p>${x[1]}</p>${x[2]?`<em>${x[2]}</em>`:''}</article>`).join('')}</div>`:''}<div class="prac"><h2>Practice</h2><p>Read the passage and choose the device. ${questions.length} questions in this set.</p><div id="quiz"></div></div></section>`;renderQuestion();$('#main').focus()}
function renderQuestion(){const box=$('#quiz');if(index>=questions.length){box.innerHTML=`<div class="qcard" role="status"><p class="qmeta">Set complete</p><div class="score" aria-label="Score: ${score} out of ${questions.length}">${score} / ${questions.length}</div><p>${score===questions.length?'Perfect score. Try another week.':'Review the lessons, then try a new set.'}</p><button class="next" id="again">Try a new random set</button></div>`;$('#again').onclick=()=>{questions=shuffle(weeks[current].qs).slice(0,Math.min(6,weeks[current].qs.length));index=0;score=0;renderQuestion()};return}const d=questions[index],options=shuffle([d[2],...d[3]]);box.innerHTML=`<div class="qcard"><div class="bar" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="${questions.length}" aria-valuenow="${index}"><i style="width:${index/questions.length*100}%"></i></div><p class="qmeta">Question ${index+1} of ${questions.length}</p><p class="quote">${d[0]}</p><p class="src">${d[1]}</p><div class="opts" role="group" aria-label="Answer choices">${options.map((o,i)=>`<button type="button" data-answer="${o}" aria-label="${String.fromCharCode(65+i)}: ${o}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div></div>`;box.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{const right=b.dataset.answer===d[2];if(right)score++;box.querySelectorAll('.opts button').forEach(x=>{x.disabled=true;if(x.dataset.answer===d[2])x.classList.add('ok');else if(x===b)x.classList.add('no')});$('#feedback').innerHTML=`<div class="fb"><strong>${right?'Correct.':'Not quite. The answer is '+d[2]+'.'}</strong> ${d[4]}</div><button class="next" id="next">${index+1===questions.length?'See score':'Next question'}</button>`;$('#next').onclick=()=>{index++;renderQuestion();$('#quiz .opts button')?.focus()};$('#next').focus()})}
renderTabs();renderPage();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ASSH1 Contemporary Literature lessons and practice">
<title>ASSH1 Contemporary Literature 1</title>
<style>
:root{--bg:#232a1e;--card:#2d3527;--ink:#fff;--muted:#d5ddca;--yellow:#ffc20e;--green:#a4e21f;--red:#ff8c98}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 system-ui,sans-serif}main,header,nav,footer{max-width:980px;margin:auto;padding:20px}header{text-align:center}h1,h2,h3{color:var(--yellow)}nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}button{font:inherit;font-weight:700;padding:10px 16px;border:2px solid #69765f;border-radius:3px;background:var(--card);color:var(--ink);cursor:pointer}button:hover,button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}nav button[aria-selected=true],.next{background:var(--yellow);color:#182016;border-color:var(--yellow)}.intro,.qcard{background:var(--card);padding:20px;margin:18px 0;border-left:6px solid var(--yellow);max-width:760px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.term{padding:16px;background:#f1d31c;color:#182016;box-shadow:3px 3px #0008}.term:nth-child(3n){background:var(--green)}.term:nth-child(3n+2){background:#f6c3bd}.term h3{color:#182016;margin-top:0}.quote{font:italic 1.25rem/1.5 Georgia,serif}.src{color:var(--yellow);font-size:.9rem}.opts{display:grid;gap:10px}.opts button{text-align:left;background:#182016}.opts button.ok{background:#1e5c33;border-color:var(--green)}.opts button.no{background:#6a2530;border-color:var(--red)}.feedback{margin-top:16px;padding:12px;background:#182016}.score{font-size:3rem;color:var(--yellow);font-weight:800}.bar{height:10px;background:#182016}.bar span{display:block;height:100%;background:var(--green)}footer{color:var(--muted);font-size:.85rem;text-align:center} @media(max-width:500px){main,header,nav,footer{padding:14px}}
</style>
</head>
<body>
<header><h1>Contemporary Literature 1</h1><p>Quarter 2 lessons and practice from literary works</p></header>
<nav id="tabs" role="tablist" aria-label="Lesson weeks"></nav>
<main id="main" tabindex="-1"></main>
<footer>Practice passages come from public-domain works and Filipino literature.</footer>
<script>
'use strict';
const weeks=[
{id:'w3',label:'Week 3: Figures of Speech',desc:'Non-literal language used to create emphasis, meaning, or imagery.',lessons:[['Simile','Compares using like or as.'],['Metaphor','Makes a direct comparison.'],['Personification','Gives human qualities to non-human things.'],['Hyperbole','Uses bold exaggeration.'],['Oxymoron','Pairs opposing meanings.'],['Onomatopoeia','Uses words that sound like their meaning.'],['Euphemism','Uses a softer expression for something uncomfortable.'],['Metonymy','Uses a related word in place of an idea.']],qs:[['“O my Luve’s like a red, red rose”','Robert Burns, “A Red, Red Rose”','Simile',['Metaphor','Hyperbole','Personification'],'The comparison uses “like”.'],['“All the world’s a stage”','William Shakespeare, As You Like It','Metaphor',['Simile','Irony','Euphemism'],'The world is directly called a stage.'],['“Death ... kindly stopped for me”','Emily Dickinson, “Because I could not stop for Death”','Personification',['Oxymoron','Metonymy','Simile'],'Death is given the human quality of kindness.'],['“Parting is such sweet sorrow”','William Shakespeare, Romeo and Juliet','Oxymoron',['Paradox','Simile','Hyperbole'],'Sweet and sorrow are opposing words paired together.'],['“The pen is mightier than the sword”','Edward Bulwer-Lytton, Richelieu','Metonymy',['Simile','Oxymoron','Euphemism'],'Pen represents writing and sword represents military force.'],['“Hope is the thing with feathers”','Emily Dickinson','Metaphor',['Simile','Personification','Hyperbole'],'Hope is directly compared to a thing with feathers.']]},
{id:'w4',label:'Week 4: Schemes',desc:'Purposeful patterns in sounds, repetition, or word arrangement.',lessons:[['Alliteration','Repeats initial consonant sounds.'],['Consonance','Repeats consonant sounds within words.'],['Assonance','Repeats vowel sounds.'],['Anaphora','Repeats words at the beginning of lines or clauses.'],['Epistrophe','Repeats words at the end.'],['Parallelism','Uses similar grammatical structures.'],['Anastrophe','Changes normal word order.'],['Climax','Arranges ideas in increasing intensity.']],qs:[['“The fair breeze blew, the white foam flew”','Samuel Taylor Coleridge, “The Rime of the Ancient Mariner”','Alliteration',['Assonance','Epistrophe','Climax'],'Initial consonant sounds repeat.'],['“It was the best of times, it was the worst of times”','Charles Dickens, A Tale of Two Cities','Anaphora',['Epistrophe','Anastrophe','Consonance'],'“It was” begins successive clauses.'],['“of the people, by the people, for the people”','Abraham Lincoln, Gettysburg Address','Epistrophe',['Anaphora','Alliteration','Anastrophe'],'The phrase repeats at the end of each part.'],['“Long I stood there wondering, fearing”','Edgar Allan Poe, “The Raven”','Anastrophe',['Climax','Parallelism','Epistrophe'],'The normal word order is deliberately changed.'],['“dedicate—we can not consecrate—we can not hallow”','Abraham Lincoln, Gettysburg Address','Climax',['Alliteration','Consonance','Epistrophe'],'The verbs increase in force.'],['“More brilliant, more fresh, more flowering”','José Rizal, “Mi Último Adiós”','Parallelism',['Epistrophe','Anastrophe','Assonance'],'Each phrase follows the same grammatical pattern.']]},
{id:'w5',label:'Week 5: Diction and Imagery',desc:'Word choice and sensory language that shape meaning, tone, and atmosphere.',lessons:[['Denotation','The literal dictionary meaning.'],['Connotation','Feelings or ideas associated with a word.'],['Formal diction','Professional or academic word choice.'],['Informal diction','Casual conversational word choice.'],['Visual','Appeals to sight.'],['Auditory','Appeals to hearing.'],['Gustatory','Appeals to taste.'],['Tactile','Appeals to touch.'],['Olfactory','Appeals to smell.'],['Kinesthetic','Appeals to movement.'],['Organic','Appeals to internal sensations.']],qs:[['“stars that shine and twinkle on the milky way”','William Wordsworth, “I Wandered Lonely as a Cloud”','Visual',['Auditory','Olfactory','Gustatory'],'Shining stars appeal to sight.'],['“fluttering and dancing in the breeze”','William Wordsworth, “I Wandered Lonely as a Cloud”','Kinesthetic',['Tactile','Gustatory','Organic'],'Fluttering and dancing describe movement.'],['“the bells, bells, bells”','Edgar Allan Poe, “The Bells”','Auditory',['Visual','Tactile','Olfactory'],'Bells appeal to hearing.'],['“candied apple, quince, and plum”','John Keats, “The Eve of St. Agnes”','Gustatory',['Olfactory','Visual','Kinesthetic'],'Candied fruit appeals to taste.'],['“would smell as sweet”','William Shakespeare, Romeo and Juliet','Olfactory',['Gustatory','Auditory','Tactile'],'Smell appeals to the sense of smell.'],['“The rough bark scraped against his palm”','Literary imagery example','Tactile',['Visual','Auditory','Kinesthetic'],'Rough bark and scraping appeal to touch.']]},
{id:'ph',label:'Filipino Literature Practice',desc:'Literary passages from Rizal, Balagtas, and Filipino writing in English translation.',lessons:[],qs:[['“Pearl of the Orient seas, our Eden lost!”','José Rizal, “Mi Último Adiós”','Metaphor',['Simile','Onomatopoeia','Euphemism'],'The homeland is directly called a pearl and an Eden.'],['“Fair hope of my fatherland!”','José Rizal, “To the Filipino Youth”','Metaphor',['Oxymoron','Irony','Synecdoche'],'Rizal directly compares the youth with the nation’s hope.'],['“In a dark, desolate forest”','Francisco Balagtas, Florante at Laura','Visual',['Gustatory','Olfactory','Auditory'],'Darkness and a forest appeal to sight.'],['“Clime of the sun caressed”','José Rizal, “Mi Último Adiós”','Tactile',['Gustatory','Auditory','Olfactory'],'A caress is a touch.'],['“I see the dawn break, through the gloom of night”','José Rizal, “Mi Último Adiós”','Visual',['Auditory','Gustatory','Tactile'],'Dawn breaking is seen.'],['“A quiet person is boiling inside”','Filipino proverb in English translation','Metaphor',['Simile','Hyperbole','Onomatopoeia'],'Hidden anger is directly described as boiling.']]}
];
const $=id=>document.getElementById(id);let current=0,questions=[],index=0,score=0,missed=[];
function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tabs(){ $('tabs').innerHTML=weeks.map((w,i)=>`<button role="tab" id="tab-${w.id}" aria-selected="${i===current}" aria-controls="panel">${w.label}</button>`).join('');document.querySelectorAll('[role=tab]').forEach((b,i)=>b.onclick=()=>{current=i;tabs();page()}) }
function newSet(source=weeks[current].qs){questions=shuffle(source).slice(0,Math.min(6,source.length));index=0;score=0;missed=[];showQuestion()}
function page(){const w=weeks[current];$('main').innerHTML=`<section id="panel" role="tabpanel" aria-labelledby="tab-${w.id}"><h2>${w.label}</h2><p>${w.desc}</p><div class="intro"><strong>Lesson guide:</strong> Identify the literary device, scheme, or type of imagery in each passage.</div>${w.lessons.length?`<div class="grid">${w.lessons.map(x=>`<article class="term"><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('')}</div>`:''}<section aria-labelledby="practice-heading"><h2 id="practice-heading">Practice</h2><p>Each set contains randomly selected literary examples.</p><div id="quiz"></div></section></section>`;newSet()}
function showQuestion(){const box=$('quiz');if(index>=questions.length){box.innerHTML=`<div class="qcard" role="status"><p>Set complete</p><div class="score" aria-label="Score ${score} out of ${questions.length}">${score} / ${questions.length}</div><p>${missed.length?'Review the questions you missed, or start a new random set.':'Perfect score!'}</p>${missed.length?'<button class="next" id="review">Review missed questions</button>':''} <button class="next" id="again">Try a new random set</button></div>`;if(missed.length)$('review').onclick=()=>{const retry=shuffle(missed);questions=retry;index=0;score=0;missed=[];showQuestion()};$('again').onclick=()=>newSet();return}const d=questions[index],opts=shuffle([d[2],...d[3]]);box.innerHTML=`<div class="qcard"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${questions.length}" aria-valuenow="${index}"><span style="width:${index/questions.length*100}%"></span></div><p>Question ${index+1} of ${questions.length}</p><p class="quote">${d[0]}</p><p class="src">${d[1]}</p><div class="opts" role="group" aria-label="Answer choices">${opts.map((o,i)=>`<button data-answer="${o}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div id="feedback" class="feedback" aria-live="polite"></div></div>`;box.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{const correct=b.dataset.answer===d[2];if(correct)score++;else missed.push(d);box.querySelectorAll('.opts button').forEach(x=>{x.disabled=true;if(x.dataset.answer===d[2])x.classList.add('ok');if(x===b&&!correct)x.classList.add('no')});$('feedback').innerHTML=`<strong>${correct?'Correct.':'Not quite. The answer is '+d[2]+'.'}</strong> ${d[4]}<br><button class="next" id="next">${index+1===questions.length?'See score':'Next question'}</button>`;$('next').onclick=()=>{index++;showQuestion()};$('next').focus()})}
tabs();page();
</script>
</body>
</html>
